<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCK 美股 DAY TRADE WEB</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0b0e14;
            color: #e2e8f0;
        }
        
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glow-green {
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Top Navigation / Header -->
    <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-emerald-500/10 border border-emerald-500/30 rounded-lg text-emerald-400">
                    <i class="fa-solid me-0.5 fa-chart-line text-xl"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="font-bold text-xl tracking-wide text-white">LCK 美股 DAY TRADE WEB</h1>
                        <span class="px-2 py-0.5 text-xs font-mono font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 rounded-full animate-pulse">
                            REAL-TIME LIVE
                        </span>
                    </div>
                    <p class="text-xs text-slate-400">TradingView K線圖 • 真實 API 行情 • 風險控管面板</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <!-- API Key Config Button -->
                <button onclick="toggleModal('apiModal')" class="px-3 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-key text-amber-400"></i>
                    <span>API 設定</span>
                </button>
            </div>
        </div>

        <!-- TradingView Ticker Tape Widget -->
        <div class="border-t border-slate-800/60 bg-slate-950/40">
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
                {
                "symbols": [
                    { "proName": "FOREXCOM:SPXUSD", "title": "S&P 500" },
                    { "proName": "FOREXCOM:NSXUSD", "title": "US 100" },
                    { "description": "NVIDIA", "proName": "NASDAQ:NVDA" },
                    { "description": "APPLE", "proName": "NASDAQ:AAPL" },
                    { "description": "TESLA", "proName": "NASDAQ:TSLA" },
                    { "description": "MICROSOFT", "proName": "NASDAQ:MSFT" },
                    { "description": "AMD", "proName": "NASDAQ:AMD" }
                ],
                "showSymbolLogo": true,
                "colorTheme": "dark",
                "isTransparent": true,
                "displayMode": "adaptive",
                "locale": "zh_TW"
                }
                </script>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 w-full space-y-6">

        <!-- Top Grid: Live Chart + Watchlist & Real Quote Fetcher -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Left 2 Cols: Interactive TradingView Chart -->
            <div class="lg:col-span-2 glass-panel rounded-xl p-4 flex flex-col h-[520px]">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-chart-candlestick text-emerald-400"></i>
                        <h2 class="font-bold text-sm text-slate-200">即時 K 線圖表</h2>
                        <span id="currentChartTicker" class="text-xs font-mono bg-slate-800 px-2 py-0.5 rounded text-emerald-400 border border-slate-700">NASDAQ:NVDA</span>
                    </div>
                    <div class="flex items-center gap-2 text-xs">
                        <span class="text-slate-400">快捷切換:</span>
                        <button onclick="changeSymbol('NASDAQ:NVDA')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 font-mono">NVDA</button>
                        <button onclick="changeSymbol('NASDAQ:TSLA')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 font-mono">TSLA</button>
                        <button onclick="changeSymbol('NASDAQ:AAPL')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 font-mono">AAPL</button>
                        <button onclick="changeSymbol('NASDAQ:QQQ')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 font-mono">QQQ</button>
                    </div>
                </div>
                
                <!-- TradingView Advanced Chart Widget -->
                <div class="w-full flex-grow rounded-lg overflow-hidden border border-slate-800 bg-slate-950" id="tv_chart_container">
                    <!-- Widget will be rendered here dynamically -->
                </div>
            </div>

            <!-- Right Col: Real-time Stock Quote Search & Watchlist -->
            <div class="glass-panel rounded-xl p-5 flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="font-bold text-sm text-slate-200 flex items-center gap-2">
                            <i class="fa-solid fa-bolt text-amber-400"></i>
                            美股真實行情查詢
                        </h2>
                        <span class="text-[10px] text-slate-400 bg-slate-800 px-2 py-0.5 rounded">Live API</span>
                    </div>

                    <!-- Symbol Search Input -->
                    <div class="flex gap-2 mb-4">
                        <div class="relative flex-grow">
                            <input type="text" id="symbolInput" value="NVDA" uppercase class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-lg px-3 py-2 text-sm font-mono uppercase text-white placeholder-slate-500 outline-none transition" placeholder="輸入美股代號 (例: TSLA)">
                        </div>
                        <button onclick="fetchStockQuote()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition flex items-center gap-1.5 shadow-lg shadow-emerald-900/30">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <span>查詢</span>
                        </button>
                    </div>

                    <!-- Live Quote Display Card -->
                    <div id="quoteResultCard" class="bg-slate-900/90 border border-slate-800 rounded-lg p-4 space-y-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="text-xl font-bold font-mono text-white flex items-center gap-2">
                                    <span id="quoteSymbol">NVDA</span>
                                    <span id="quoteBadge" class="text-[10px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded border border-emerald-500/30">LIVE</span>
                                </div>
                                <div class="text-xs text-slate-400" id="quoteName">NVIDIA Corporation</div>
                            </div>
                            <div class="text-right">
                                <div class="text-2xl font-bold font-mono text-emerald-400" id="quotePrice">\$138.25</div>
                                <div class="text-xs font-mono text-emerald-400" id="quoteChange">+3.45 (+2.56%)</div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800/80 text-xs font-mono">
                            <div class="flex justify-between text-slate-400">
                                <span>今日最高:</span>
                                <span class="text-slate-200" id="quoteHigh">\$140.10</span>
                            </div>
                            <div class="flex justify-between text-slate-400">
                                <span>今日最低:</span>
                                <span class="text-slate-200" id="quoteLow">\$135.80</span>
                            </div>
                            <div class="flex justify-between text-slate-400">
                                <span>今早開盤:</span>
                                <span class="text-slate-200" id="quoteOpen">\$136.00</span>
                            </div>
                            <div class="flex justify-between text-slate-400">
                                <span>前日收盤:</span>
                                <span class="text-slate-200" id="quotePrevClose">\$134.80</span>
                            </div>
                        </div>

                        <!-- One Click Apply Button -->
                        <button onclick="applyQuoteToCalculator()" class="w-full mt-2 bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-emerald-500/30 hover:border-emerald-500 font-medium py-2 rounded-lg text-xs transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-arrows-to-dot"></i>
                            <span>套用即時報價至倉位精算器</span>
                        </button>
                    </div>
                </div>

                <!-- Quick Watchlist Buttons -->
                <div class="mt-4 pt-4 border-t border-slate-800">
                    <div class="text-xs text-slate-400 mb-2">熱門監控對象:</div>
                    <div class="grid grid-cols-4 gap-1.5">
                        <button onclick="quickSelect('NVDA')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 rounded py-1.5 text-xs font-mono text-center">NVDA</button>
                        <button onclick="quickSelect('TSLA')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 rounded py-1.5 text-xs font-mono text-center">TSLA</button>
                        <button onclick="quickSelect('AAPL')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 rounded py-1.5 text-xs font-mono text-center">AAPL</button>
                        <button onclick="quickSelect('AMD')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 rounded py-1.5 text-xs font-mono text-center">AMD</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Middle Grid: Position Sizer & Checklist -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Position Calculator -->
            <div class="lg:col-span-2 glass-panel rounded-xl p-5">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-bold text-sm text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-calculator text-emerald-400"></i>
                        日內交易倉位與風控精算器
                    </h2>
                    <span class="text-xs text-slate-400 font-mono">1R 風險控制模式</span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">總資金 / 本金 (USD)</label>
                        <input type="number" id="accountSize" value="10000" class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-lg px-3 py-2 text-sm font-mono text-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">單筆容忍風險 (% 或 USD)</label>
                        <div class="flex gap-2">
                            <input type="number" id="riskPercent" value="1" step="0.5" class="w-24 bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-lg px-3 py-2 text-sm font-mono text-white outline-none">
                            <span class="self-center text-xs text-slate-500">% = \$<span id="riskAmountCalculated">100</span></span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">交易代號 (Ticker)</label>
                        <input type="text" id="tradeTicker" value="NVDA" class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-lg px-3 py-2 text-sm font-mono uppercase text-white outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5 pt-3 border-t border-slate-800">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">預計買入價 (Entry)</label>
                        <input type="number" id="entryPrice" value="138.25" step="0.01" class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-lg px-3 py-2 text-sm font-mono text-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">停損價 (Stop Loss)</label>
                        <input type="number" id="stopPrice" value="136.50" step="0.01" class="w-full bg-slate-900 border border-slate-700 focus:border-rose-500 rounded-lg px-3 py-2 text-sm font-mono text-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">目標停利價 (Take Profit)</label>
                        <input type="number" id="targetPrice" value="142.50" step="0.01" class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-lg px-3 py-2 text-sm font-mono text-white outline-none">
                    </div>
                </div>

                <!-- Calculation Results Output -->
                <div class="bg-slate-950/80 rounded-xl p-4 border border-slate-800 grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                    <div>
                        <div class="text-[11px] text-slate-400 mb-0.5">建議購買股數</div>
                        <div class="text-2xl font-bold font-mono text-emerald-400" id="calcShares">57 股</div>
                    </div>
                    <div>
                        <div
